<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AdminZero Prototype</title>
<style>
  :root {
    --bg: #0b0d12; --panel: #12151c; --panel-2: #181c25; --line: #252a36; --text: #e6e8ee;
    --muted: #8a92a6; --accent: #7c8cff; --accent-2: #5b6cf0; --ok: #3ecf8e; --warn: #f5b84b;
    --bad: #ff6b6b; --info: #4cc3ff; --radius: 10px;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  :root[data-theme="light"] {
    --bg: #f6f7fb; --panel: #ffffff; --panel-2: #f0f2f8; --line: #e1e4ee; --text: #161a23; --muted: #5d6578;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-size: 14px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  nav { background: var(--panel); border-right: 1px solid var(--line); padding: 16px 10px; display: flex; flex-direction: column; gap: 2px; }
  .brand { font-weight: 700; font-size: 16px; padding: 6px 10px 18px; letter-spacing: -.01em; }
  .brand span { color: var(--accent); }
  nav button { background: none; border: 0; text-align: left; padding: 8px 10px; border-radius: 8px; color: var(--muted); display: flex; gap: 10px; align-items: center; }
  nav button:hover { background: var(--panel-2); color: var(--text); }
  nav button.active { background: var(--panel-2); color: var(--text); }
  nav .sep { margin: 14px 10px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  nav .toggle { margin-top: auto; }
  main { padding: 22px 26px; overflow: auto; }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -.01em; }
  .sub { color: var(--muted); margin-bottom: 18px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .board { display: grid; grid-template-columns: repeat(5, minmax(210px, 1fr)); gap: 12px; overflow-x: auto; }
  .col { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; min-height: 300px; }
  .col h3 { font-size: 12px; margin: 2px 4px 10px; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; }
  .card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 8px; cursor: pointer; transition: border-color .15s; }
  .card:hover { border-color: var(--accent); }
  .card .k { color: var(--muted); font-size: 12px; }
  .card .t { margin: 4px 0 8px; font-weight: 500; }
  .pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 99px; font-size: 11px; background: var(--line); color: var(--text); }
  .pill.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .pill.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .pill.bad { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
  .pill.info { background: color-mix(in srgb, var(--info) 18%, transparent); color: var(--info); }
  .avatars { display: flex; margin-left: auto; }
  .av { width: 22px; height: 22px; border-radius: 50%; background: var(--accent-2); font-size: 10px; display: grid; place-items: center; border: 2px solid var(--panel-2); margin-left: -6px; color: #fff; }
  .grid2 { display: grid; grid-template-columns: 1fr 380px; gap: 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .panel h2 { font-size: 14px; margin: 0 0 12px; }
  .btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent-2); border-color: var(--accent-2); color: #fff; }
  .btn.small { padding: 4px 9px; font-size: 12px; }
  .timeline { border-left: 2px solid var(--line); margin-left: 6px; padding-left: 14px; }
  .ev { margin-bottom: 14px; position: relative; }
  .ev::before { content: ""; position: absolute; left: -20px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .ev .who { color: var(--muted); font-size: 12px; }
  .ev.handoff::before { background: var(--warn); }
  .ev pre { white-space: pre-wrap; font-family: inherit; background: var(--panel-2); padding: 8px 10px; border-radius: 8px; margin: 6px 0 0; }
  .copilot .rec { background: var(--panel-2); border-radius: 8px; padding: 10px; margin-bottom: 8px; }
  .cite { color: var(--accent); font-size: 12px; text-decoration: none; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 13px; }
  .split div { background: var(--panel-2); padding: 8px; border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .kpi .v { font-size: 22px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .kpi .l { color: var(--muted); font-size: 12px; }
  .chat { max-width: 640px; }
  .msgs { display: flex; flex-direction: column; gap: 10px; min-height: 260px; margin-bottom: 12px; }
  .msg { padding: 10px 12px; border-radius: 12px; max-width: 80%; line-height: 1.45; }
  .msg.user { background: var(--accent-2); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.bot { background: var(--panel-2); align-self: flex-start; border-bottom-left-radius: 4px; }
  .json { font-family: ui-monospace, Menlo, monospace; font-size: 12px; background: var(--panel-2); padding: 10px; border-radius: 8px; white-space: pre-wrap; color: var(--muted); }
  input, textarea, select { font: inherit; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 8px 10px; width: 100%; }
  label { font-size: 12px; color: var(--muted); display: block; margin: 10px 0 4px; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 16px; z-index: 10; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; width: min(480px, 100%); }
  .toast { position: fixed; bottom: 18px; right: 18px; background: var(--panel); border: 1px solid var(--ok); padding: 10px 14px; border-radius: 10px; z-index: 20; }
  .muted { color: var(--muted); }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    nav { flex-direction: row; overflow-x: auto; padding: 8px; }
    nav .sep, .brand { display: none; }
    nav .toggle { margin-top: 0; }
    main { padding: 16px; }
    .grid2 { grid-template-columns: 1fr; }
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .board { grid-template-columns: repeat(5, 240px); }
  }
</style>
</head>
<body>
<div class="app">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<script>
const STATUSES = ["AI_TRIAGED", "ACTIVE_SWARM", "WAITING_ON_CUSTOMER", "WAITING_ON_VENDOR", "RESOLVED_KB_LINKED"];
const LABEL = { AI_TRIAGED: "AI triaged", ACTIVE_SWARM: "Active swarm", WAITING_ON_CUSTOMER: "Waiting on customer ⏸",
  WAITING_ON_VENDOR: "Waiting on vendor ⏸", RESOLVED_KB_LINKED: "Resolved · KB linked" };
const state = {
  view: "board",
  selected: null,
  tickets: [
    { id: 1001, type: "INC", title: "VPN drops every 10 minutes", status: "ACTIVE_SWARM", urgency: 4, group: "network",
      lang: "es", original: "El VPN se desconecta cada 10 minutos y no puedo trabajar 😩", sentiment: "frustrated",
      requester: "maria@corp.com", slaMin: 212, swarm: ["AA", "SS"], asset: "LT-0042 · MacBook Pro 14 · MDM enrolled",
      events: [
        { who: "ai:intake", kind: "status", body: "Created from Spanish chat. Template INC-NETWORK, urgency 4." },
        { who: "alex.agent", kind: "note", body: "Joined swarm." },
      ] },
    { id: 1002, type: "SR", title: "Access to Figma for design review", status: "AI_TRIAGED", urgency: 2, group: "saas-ops",
      lang: "en", requester: "joe@corp.com", slaMin: 4100, swarm: [], events: [] },
    { id: 1003, type: "INC", title: "[SIEM] Impossible travel – maria@corp.com", status: "ACTIVE_SWARM", urgency: 5,
      group: "security", lang: "en", requester: "maria@corp.com", slaMin: 95, swarm: ["PA"], events: [] },
    { id: 1004, type: "INC", title: "Printer on 3rd floor jams", status: "WAITING_ON_VENDOR", urgency: 2, group: "endpoint",
      lang: "en", requester: "li@corp.com", slaMin: 2600, swarm: ["SS"], paused: true, events: [] },
    { id: 1005, type: "SR", title: "Nouvel ordinateur pour stagiaire", status: "WAITING_ON_CUSTOMER", urgency: 2,
      group: "endpoint", lang: "fr", requester: "claire@corp.com", slaMin: 3900, swarm: [], paused: true, events: [] },
    { id: 1006, type: "INC", title: "Outlook won't sync calendar", status: "RESOLVED_KB_LINKED", urgency: 3,
      group: "service-desk", lang: "en", requester: "sam@corp.com", slaMin: 0, swarm: ["AA"], kb: "KB-388", events: [] },
  ],
  seats: [
    { id: 1, user: "joe@corp.com", app: "Figma", last: 64, cost: 15 },
    { id: 2, user: "dana@corp.com", app: "Salesforce", last: 91, cost: 150 },
    { id: 3, user: "li@corp.com", app: "Zoom", last: 45, cost: 13.33 },
    { id: 4, user: "omar@corp.com", app: "Adobe CC", last: 120, cost: 84.99 },
  ],
  shadow: [{ app: "NotionAI", users: 14, via: "OAuth", scopes: "drive.readonly" },
           { app: "Otter.ai", users: 6, via: "OAuth", scopes: "calendar.read" },
           { app: "Canva", users: 22, via: "SSO", scopes: "—" }],
  elevation: null,
  saved: 0,
};

const NAV = [
  ["sep", "Agent workspace"], ["board", "▦  Swarm board"], ["ticket", "◧  Ticket + Copilot"],
  ["sep", "End user"], ["intake", "💬  Intake chat"],
  ["sep", "Modules"], ["saas", "☁  SaaS management"], ["assets", "🖥  Assets / CMDB"], ["vault", "🔐  Vault (JIT)"],
];

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function sla(t) {
  if (t.status === "RESOLVED_KB_LINKED") return `<span class="pill ok">✓ ${esc(t.kb || "KB")}</span>`;
  if (t.paused) return `<span class="pill info">⏸ SLA paused</span>`;
  const h = Math.floor(t.slaMin / 60), m = t.slaMin % 60;
  const cls = t.slaMin < 120 ? "bad" : t.slaMin < 480 ? "warn" : "";
  return `<span class="pill ${cls}">⏱ ${h}h ${m}m</span>`;
}
function toast(msg) {
  const el = document.createElement("div"); el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 2600);
}

function renderNav() {
  document.getElementById("nav").innerHTML = `<div class="brand">Admin<span>Zero</span></div>` +
    NAV.map(([k, l]) => k === "sep" ? `<div class="sep">${l}</div>`
      : `<button class="${state.view === k ? "active" : ""}" data-view="${k}">${l}</button>`).join("") +
    `<button class="toggle" id="theme">◐  Theme</button>`;
}

function viewBoard() {
  return `<h1>Swarm board</h1><div class="sub">Everyone sees every ticket by status — no assignee silos. Click a card to open it.</div>
  <div class="board">${STATUSES.map(s => {
    const ts = state.tickets.filter(t => t.status === s);
    return `<div class="col" data-drop="${s}"><h3>${LABEL[s]}<span>${ts.length}</span></h3>${ts.map(t => `
      <div class="card" data-open="${t.id}" draggable="true" data-drag="${t.id}">
        <div class="k">${t.type}-${t.id} · ${esc(t.group)} ${t.lang !== "en" ? `· 🌐 ${t.lang}` : ""}</div>
        <div class="t">${esc(t.title)}</div>
        <div class="row">${sla(t)} <span class="pill">P${6 - t.urgency}</span>
          <div class="avatars">${t.swarm.map(a => `<div class="av">${a}</div>`).join("")}</div></div>
      </div>`).join("")}</div>`;
  }).join("")}</div>`;
}

function viewTicket() {
  const t = state.tickets.find(x => x.id === state.selected) || state.tickets[0];
  state.selected = t.id;
  return `<div class="row" style="justify-content:space-between"><div><h1>${t.type}-${t.id} · ${esc(t.title)}</h1>
    <div class="sub">${esc(t.requester)} · ${esc(t.group)} · ${LABEL[t.status]} · ${sla(t)}</div></div>
    <div class="row"><button class="btn" data-act="handoff">⇄ Hand off</button>
    <button class="btn" data-act="swarm">+ Join swarm</button>
    <button class="btn primary" data-act="resolve">Resolve with KB</button></div></div>
  <div class="grid2">
    <div class="panel"><h2>Timeline</h2>
      ${t.original ? `<div class="split" style="margin-bottom:14px"><div><b>Original (${t.lang})</b><br>${esc(t.original)}</div>
        <div><b>English</b><br>The VPN disconnects every 10 minutes and I can't work.</div></div>` : ""}
      ${t.asset ? `<p class="muted">Linked CI: ${esc(t.asset)}</p>` : ""}
      <div class="timeline">${t.events.map(e => `<div class="ev ${e.kind}"><div class="who">${esc(e.who)} · ${e.kind}</div>
        ${e.kind === "handoff" ? `<pre>${esc(e.body)}</pre>` : `<div>${esc(e.body)}</div>`}</div>`).join("") || `<p class="muted">No activity yet.</p>`}</div>
    </div>
    <div class="panel copilot"><h2>✦ Agent-Assist Copilot</h2>
      <p class="muted" style="margin-top:0">Grounded in KB, CMDB and SIEM only. Ungrounded suggestions are dropped server-side.</p>
      <div class="rec"><b>Flush DNS and renew DHCP on LT-0042</b><br><span class="muted">MDM shows Wi-Fi roaming every ~10 min matching the drop interval.</span><br>
        <a class="cite" href="#">KB-402 v2</a></div>
      <div class="rec"><b>Macro: flush-dns-and-renew-dhcp</b> <span class="pill">needs approval</span><br>
        <button class="btn small primary" data-act="macro" style="margin-top:6px">Approve & run</button> <a class="cite" href="#">KB-402</a></div>
      <div class="rec"><b>JIT elevation: Core switch admin</b><br><span class="muted">Check port flaps on uplink. 1-hour access tied to ${t.type}-${t.id}.</span><br>
        <button class="btn small" data-act="jit" style="margin-top:6px">Request elevation</button> <a class="cite" href="#">KB-415</a></div>
      <h2 style="margin-top:16px">Draft reply</h2>
      <div class="split"><div><b>es</b><br>Hola María, siento mucho la frustración. Ya estamos revisando tu conexión y te escribo en cuanto tengamos novedades.</div>
      <div><b>en</b><br>Hi María, I'm really sorry for the frustration. We're already looking at your connection and I'll write as soon as we have news.</div></div>
      <div class="row" style="margin-top:10px"><button class="btn primary" data-act="send">Send reply</button></div>
    </div>
  </div>`;
}

const INTAKE_SCRIPT = [
  { user: "El VPN se desconecta cada 10 minutos y no puedo trabajar 😩",
    bot: "¡Hola María! Siento mucho lo que estás viviendo — trabajar así es agotador. Mientras preparo tu ticket, puedes probar a reconectar tras desactivar y activar el Wi-Fi (KB-402). Tu ticket ya está en camino al equipo de red.",
    json: { detected_language: "es", urgency_score: 4, sentiment: "frustrated", selected_template_id: "INC-NETWORK",
      english_summary_for_agent: "VPN drops every ~10 min on LT-0042 (MacBook Pro, MDM enrolled). User fully blocked.",
      required_approvals: [], recommended_swarm_group: "network", self_service_kb_ids: ["KB-402"], ready_to_submit: true } },
];
function viewIntake() {
  return `<h1>Conversational intake</h1><div class="sub">Users write in any language. No forms. The agent maps the message to a predefined template.</div>
  <div class="grid2"><div class="panel chat"><div class="msgs" id="msgs">
    <div class="msg bot">Hi! I'm the IT helper. Tell me what's going on, in whatever language you like.</div></div>
    <div class="row"><input id="chatIn" value="${esc(INTAKE_SCRIPT[0].user)}"><button class="btn primary" data-act="chat">Send</button></div></div>
    <div class="panel"><h2>Structured output → ticket</h2><div class="json" id="json">Waiting for a message…</div></div></div>`;
}

function viewSaas() {
  const idleCost = state.seats.reduce((a, s) => a + s.cost, 0);
  return `<h1>SaaS management</h1><div class="sub">Discovery from SSO + OAuth grants. Reclaim idle seats in one click.</div>
  <div class="kpis"><div class="kpi"><div class="l">Apps discovered</div><div class="v">143</div></div>
    <div class="kpi"><div class="l">Shadow IT apps</div><div class="v">${state.shadow.length}</div></div>
    <div class="kpi"><div class="l">Idle seat spend / yr</div><div class="v">$${(idleCost * 12).toFixed(0)}</div></div>
    <div class="kpi"><div class="l">Saved this session / yr</div><div class="v" style="color:var(--ok)">$${(state.saved * 12).toFixed(0)}</div></div></div>
  <div class="grid2"><div class="panel"><h2>Idle seats (30+ days)</h2><table><tr><th>User</th><th>App</th><th>Last active</th><th>$/mo</th><th></th></tr>
    ${state.seats.map(s => `<tr><td>${esc(s.user)}</td><td>${esc(s.app)}</td><td>${s.last}d ago</td><td>$${s.cost}</td>
    <td><button class="btn small" data-reclaim="${s.id}">Reclaim</button></td></tr>`).join("") || `<tr><td colspan=5 class="muted">No idle seats 🎉</td></tr>`}</table>
    ${state.seats.length ? `<div class="row" style="margin-top:12px"><button class="btn primary" data-act="reclaimAll">Reclaim all</button></div>` : ""}</div>
  <div class="panel"><h2>Shadow IT</h2><table><tr><th>App</th><th>Users</th><th>Via</th></tr>
    ${state.shadow.map(s => `<tr><td>${esc(s.app)}<div class="muted" style="font-size:12px">${esc(s.scopes)}</div></td><td>${s.users}</td><td>${s.via}</td></tr>`).join("")}</table></div></div>`;
}

function viewAssets() {
  const rows = [["LT-0042", "MacBook Pro 14", "maria@corp.com", "DEPLOYED", "ENROLLED", "INC-1001, INC-1003"],
    ["LT-0107", "ThinkPad X1", "joe@corp.com", "IN_REPAIR", "NON_COMPLIANT", "—"],
    ["SW-CORE-01", "Core switch", "netops", "DEPLOYED", "—", "CHG-1012"],
    ["LT-0311", "MacBook Air", "—", "RECEIVED", "NOT_ENROLLED", "—"]];
  const pill = s => ({ ENROLLED: "ok", NON_COMPLIANT: "bad", NOT_ENROLLED: "warn" }[s] || "");
  return `<h1>Assets / CMDB</h1><div class="sub">Unlimited assets. Procurement → disposal lifecycle, MDM posture, linked tickets and changes.</div>
  <div class="panel"><table><tr><th>Tag</th><th>Name</th><th>Owner</th><th>Lifecycle</th><th>MDM</th><th>Linked</th></tr>
  ${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td><span class="pill">${r[3]}</span></td>
  <td><span class="pill ${pill(r[4])}">${r[4]}</span></td><td class="muted">${r[5]}</td></tr>`).join("")}</table></div>`;
}

function viewVault() {
  const e = state.elevation;
  return `<h1>Vault · Just-In-Time access</h1><div class="sub">Zero-knowledge: the server only stores ciphertext. Access is 1 hour, tied to an open ticket, approved by someone else, and fully audited.</div>
  <div class="grid2"><div class="panel"><h2>Credentials</h2><table><tr><th>Name</th><th>Roles</th><th>Access</th></tr>
    <tr><td>Core switch admin</td><td>agent</td><td>${e ? (e.status === "APPROVED" ? `<span class="pill ok">until ${e.until}</span>` : `<span class="pill warn">${e.status}</span>`) : `<button class="btn small" data-act="jit">Request</button>`}</td></tr>
    <tr><td>AWS break-glass</td><td>admin</td><td class="muted">Not permitted for your role</td></tr></table>
    ${e && e.status === "PENDING" ? `<div class="row" style="margin-top:12px"><button class="btn primary" data-act="approve">Approve as pat.approver</button></div>` : ""}</div>
  <div class="panel"><h2>Audit log</h2><table><tr><th>Action</th><th>Actor</th><th>Outcome</th></tr>
    ${(e?.audit || []).map(a => `<tr><td>${a[0]}</td><td>${a[1]}</td><td><span class="pill ${a[2] === "allowed" ? "ok" : "bad"}">${a[2]}</span></td></tr>`).join("") || `<tr><td colspan=3 class="muted">No events yet.</td></tr>`}</table></div></div>`;
}

function render() {
  renderNav();
  const views = { board: viewBoard, ticket: viewTicket, intake: viewIntake, saas: viewSaas, assets: viewAssets, vault: viewVault };
  document.getElementById("main").innerHTML = views[state.view]();
}

function modal(html, onSubmit) {
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<form class="modal">${html}<div class="row" style="margin-top:14px;justify-content:flex-end">
    <button type="button" class="btn" data-x>Cancel</button><button class="btn primary">Confirm</button></div></form>`;
  bg.querySelector("[data-x]").onclick = () => bg.remove();
  bg.querySelector("form").onsubmit = ev => { ev.preventDefault(); if (onSubmit(new FormData(ev.target)) !== false) bg.remove(); };
  document.body.appendChild(bg);
}

function requestJit() {
  const t = state.tickets.find(x => x.id === (state.selected || 1001));
  state.elevation = { status: "PENDING", audit: [["request", "alex.agent", "allowed"]] };
  toast(`Elevation requested for ${t.type}-${t.id}. Waiting for approver.`); render();
}

document.addEventListener("click", ev => {
  const el = ev.target.closest("button, .card"); if (!el) return;
  if (el.id === "theme") {
    const root = document.documentElement;
    root.dataset.theme = root.dataset.theme === "light" ? "dark" : "light"; return;
  }
  if (el.dataset.view) { state.view = el.dataset.view; render(); return; }
  if (el.dataset.open) { state.selected = +el.dataset.open; state.view = "ticket"; render(); return; }
  if (el.dataset.reclaim) {
    const s = state.seats.find(x => x.id === +el.dataset.reclaim); state.saved += s.cost;
    state.seats = state.seats.filter(x => x !== s); toast(`Reclaimed ${s.app} seat from ${s.user}`); render(); return;
  }
  const t = state.tickets.find(x => x.id === state.selected);
  switch (el.dataset.act) {
    case "handoff":
      modal(`<h2>Hand off ${t.type}-${t.id}</h2><p class="muted">No silent handoffs — every field is required.</p>
        <label>To group</label><select name="g"><option>identity</option><option>endpoint</option><option>security</option><option>network</option></select>
        <label>Reason</label><input name="r" required minlength="10" placeholder="Why does this need another team?">
        <label>What was tried</label><textarea name="w" required minlength="10" rows="2"></textarea>
        <label>Next step</label><input name="n" required minlength="5">`, f => {
        t.events.push({ who: "alex.agent", kind: "handoff", body: `${t.group} → ${f.get("g")}\nReason: ${f.get("r")}\nTried: ${f.get("w")}\nNext: ${f.get("n")}` });
        t.group = f.get("g"); if (t.status !== "ACTIVE_SWARM") { t.status = "ACTIVE_SWARM"; t.paused = false; }
        toast(`Handed off to ${t.group}. Requester notified.`); render();
      }); break;
    case "swarm": if (!t.swarm.includes("AA")) t.swarm.push("AA"); t.events.push({ who: "alex.agent", kind: "note", body: "Joined swarm." }); render(); break;
    case "resolve":
      modal(`<h2>Resolve ${t.type}-${t.id}</h2><p class="muted">Resolution requires a linked knowledge base article.</p>
        <label>KB article</label><select name="kb"><option>KB-402 · Fix VPN disconnects</option><option>KB-388 · Outlook calendar sync</option></select>
        <label>Resolution note</label><textarea name="n" rows="2"></textarea>`, f => {
        t.status = "RESOLVED_KB_LINKED"; t.kb = f.get("kb").split(" ")[0];
        t.events.push({ who: "alex.agent", kind: "status", body: `Resolved, linked ${t.kb}` }); toast("Resolved and KB linked"); render();
      }); break;
    case "macro": t.events.push({ who: "ai:copilot (approved by alex.agent)", kind: "note", body: "Ran macro flush-dns-and-renew-dhcp on LT-0042." }); toast("Macro executed via MDM"); render(); break;
    case "jit": requestJit(); break;
    case "approve": {
      const until = new Date(Date.now() + 3600e3).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      Object.assign(state.elevation, { status: "APPROVED", until });
      state.elevation.audit.push(["approve", "pat.approver", "allowed"], ["reveal", "alex.agent", "allowed"]);
      toast("Approved — access expires in 60 minutes"); render(); break;
    }
    case "send": t.events.push({ who: "alex.agent", kind: "note", body: "Sent reply (es)." }); toast("Reply sent in Spanish"); render(); break;
    case "chat": {
      const s = INTAKE_SCRIPT[0], msgs = document.getElementById("msgs"), text = document.getElementById("chatIn").value;
      msgs.insertAdjacentHTML("beforeend", `<div class="msg user">${esc(text)}</div><div class="msg bot muted" id="typing">…</div>`);
      setTimeout(() => {
        document.getElementById("typing").outerHTML = `<div class="msg bot">${esc(s.bot)}</div>`;
        document.getElementById("json").textContent = JSON.stringify(s.json, null, 2) + "\n\n→ Created INC-1001 in AI_TRIAGED for #network";
      }, 700); break;
    }
  }
});

// Drag-and-drop between swarm columns (prototype of status transitions).
document.addEventListener("dragstart", e => { const id = e.target.dataset?.drag; if (id) e.dataTransfer.setData("text", id); });
document.addEventListener("dragover", e => { if (e.target.closest("[data-drop]")) e.preventDefault(); });
document.addEventListener("drop", e => {
  const col = e.target.closest("[data-drop]"); if (!col) return;
  const t = state.tickets.find(x => x.id === +e.dataTransfer.getData("text"));
  const to = col.dataset.drop;
  if (to === "RESOLVED_KB_LINKED") { state.selected = t.id; state.view = "ticket"; render(); document.querySelector('[data-act="resolve"]').click(); return; }
  t.status = to; t.paused = to.startsWith("WAITING"); toast(`${t.type}-${t.id} → ${LABEL[to]}`); render();
});

render();
</script>
</body>
</html>
