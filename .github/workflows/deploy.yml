name: test-and-deploy

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

env:
  # Set these as GitHub repository *variables* (not secrets — none of them are sensitive).
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  AR_REPO: ${{ vars.ARTIFACT_REGISTRY_REPO }}
  SERVICE: adminzero-api
  WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}          # projects/<num>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
  DEPLOY_SA: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}   # deployer@<project>.iam.gserviceaccount.com
  RUNTIME_SA: ${{ vars.RUNTIME_SERVICE_ACCOUNT }} # adminzero-run@<project>.iam.gserviceaccount.com

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  build-image:
    # Verifies the container builds on develop and PRs. No GCP credentials needed; nothing is pushed.
    needs: test
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t adminzero-api:${{ github.sha }} backend
      - run: docker build -t adminzero-site:${{ github.sha }} .   # Nginx static site (prototype)

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # keyless OIDC → Workload Identity Federation; no JSON keys anywhere
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
          token_format: access_token

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPO}/${SERVICE}:${GITHUB_SHA}"
          docker build -t "$IMAGE" backend
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.IMAGE }}
          flags: >-
            --service-account=${{ env.RUNTIME_SA }}
            --no-allow-unauthenticated
            --min-instances=1
          env_vars: |
            ADMINZERO_ENV=production
            GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }}
